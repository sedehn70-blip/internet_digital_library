<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>کتابخانه دیجیتال - مرکز ری شناسی</title>
    <link href="{{ url_for('static', filename='css/bootstrap.rtl.min.css') }}" rel="stylesheet">

    <!-- Bootstrap Icons Local -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap-icons.css') }}">

    <style>
        body {
        background: linear-gradient(135deg, #667eea, #764ba2);
        font-family: 'Vazir', Tahoma, sans-serif;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .card {
        border-radius: 20px;
        padding: 40px 30px;
        max-width: 450px;
        width: 100%;
        background: #ffffff;
        box-shadow: 0 15px 30px rgba(0,0,0,0.15);
        transition: transform 0.3s, box-shadow 0.3s;
    }

    .card:hover {
        transform: translateY(-5px);
        box-shadow: 0 25px 40px rgba(0,0,0,0.2);
    }

    h3 {
        text-align: center;
        margin-bottom: 30px;
        font-weight: 700;
        color: #333;
    }

    label {
        font-weight: 500;
        color: #555;
    }

    .form-control:focus {
        border-color: #764ba2;
        box-shadow: 0 0 0 0.2rem rgba(118,75,162,0.25);
    }

    .btn-primary {
        background-color: #764ba2;
        border: none;
        font-weight: 600;
        transition: background 0.3s;
    }

    .btn-primary:hover {
        background-color: #5c3992;
    }

    a {
        color: #764ba2;
        text-decoration: none;
        transition: color 0.2s;
    }

    a:hover {
        color: #5c3992;
    }

    .flash {
        text-align: center;
        padding: 10px;
        margin-bottom: 15px;
        border-radius: 8px;
    }
    .flash.success { background-color: #d4edda; color: #155724; }
    .flash.danger { background-color: #f8d7da; color: #721c24; }
    .flash.info { background-color: #cce5ff; color: #004085; }
</style>
</head>
<body>

<div class="card">

    <h3>بازیابی رمز عبور</h3>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST">
        <div class="mb-3">
            <label for="username">نام کاربری</label>
            <input type="text" id="username" name="username" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="recovery_code">کد بازیابی</label>
            <input type="text" id="recovery_code" name="recovery_code" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="new_password">رمز عبور جدید</label>
            <input type="password" id="new_password" name="new_password" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="confirm_password">تکرار رمز عبور جدید</label>
            <input type="password" id="confirm_password" name="confirm_password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">تغییر رمز عبور</button>
        <p class="text-center mt-3">
            بازگشت به <a href="{{ url_for('login') }}">صفحه ورود</a>
        </p>
    </form>

</div>

</body>
</html>
