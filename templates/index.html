<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کتابخانه دیجیتال - مرکز ری شناسی</title>
    <link href="{{ url_for('static', filename='css/bootstrap.rtl.min.css') }}" rel="stylesheet">

    <!-- Bootstrap Icons Local -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap-icons.css') }}">
    <style>
        body {
            font-family: 'BZar', sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #fff;
        }
        .welcome-card {
            background: rgba(255, 255, 255, 0.95);
            color: #333;
            border-radius: 20px;
            padding: 50px 30px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
            max-width: 500px;
            width: 100%;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .welcome-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.35);
        }
        h1 {
            font-weight: 700;
            margin-bottom: 20px;
        }
        p {
            font-size: 1.2rem;
            margin-bottom: 30px;
        }
        .btn {
            border-radius: 50px;
            padding: 12px 25px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(to right, #667eea, #764ba2);
            border: none;
            color: #fff;
        }
        .btn-primary:hover {
            background: linear-gradient(to right, #764ba2, #667eea);
        }
        .btn-success {
            background: linear-gradient(to right, #43e97b, #38f9d7);
            border: none;
            color: #fff;
        }
        .btn-success:hover {
            background: linear-gradient(to right, #38f9d7, #43e97b);
        }
        @media (max-width: 576px) {
            .welcome-card {
                padding: 30px 20px;
            }
            h1 {
                font-size: 1.8rem;
            }
            p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
<div class="welcome-card text-center">
    <h1><i class="bi bi-book-half me-2"></i>به کتابخانه خوش‌آمدید!</h1>
    <p>لطفاً برای ادامه ابتدا وارد شوید یا ثبت‌نام کنید.</p>
    <a href="{{ url_for('login') }}" class="btn btn-primary mx-2"><i class="bi bi-box-arrow-in-right me-2"></i>ورود</a>
    <a href="{{ url_for('register') }}" class="btn btn-success mx-2"><i class="bi bi-pencil-square me-2"></i>ثبت‌نام</a>
</div>
</body>
</html>
