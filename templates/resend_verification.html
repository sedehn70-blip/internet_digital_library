<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>کتابخانه دیجیتال - ارسال دوباره ایمیل تأیید</title>
<link href="{{ url_for('static', filename='css/bootstrap.rtl.min.css') }}" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap-icons.css') }}">
<style>
@font-face {
    font-family: 'BTitr';
    src: url("{{ url_for('static', filename='css/fonts/BTitr.woff2') }}") format('woff2'),
         url("{{ url_for('static', filename='css/fonts/BTitr.woff') }}") format('woff');
    font-weight: normal; font-style: normal; font-display: swap;
}
body { font-family: 'BZar', Tahoma, sans-serif; background: #f3f4f6; }
h1, h2, h3, h4, h5, h6 { font-family: 'BTitr'; }
.container { max-width: 420px; margin-top: 60px; }
</style>
</head>
<body>
<div class="container">
    <h2 class="mb-4 text-center">ارسال دوباره ایمیل تأیید</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
            <label for="username" class="form-label">نام کاربری</label>
            <input type="text" class="form-control" id="username" name="username" autocomplete="username" required>
        </div>
        <button type="submit" class="btn btn-warning w-100">ارسال دوباره</button>
    </form>

    <p class="mt-3 text-center">
        <a href="{{ url_for('login') }}">بازگشت به ورود</a>
    </p>
</div>

<script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
