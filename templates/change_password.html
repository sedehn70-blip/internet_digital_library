<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>کتابخانه دیجیتال - مرکز ری شناسی</title>

    <!-- فونت‌ها -->
    <style>
        @font-face {
            font-family: 'BTitr';
            src: url("{{ url_for('static', filename='fonts/BTitr.woff2') }}");
        }
        @font-face {
            font-family: 'BZar';
            src: url("{{ url_for('static', filename='fonts/BZar.woff2') }}");
        }

        body {
            font-family: 'BZar', Tahoma, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #fff;
            padding: 30px 25px;
            border-radius: 15px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 100%;
        }

        /* تیترها با فونت تیتر */
        h1, h2, h3, h4, h5, h6 {
            font-family: 'BTitr';
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-family: 'BZar';
        }
        button {
            margin-top: 20px;
            width: 100%;
            background: #764ba2;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'BZar';
        }
        button:hover {
            background: #667eea;
        }

        .flashes {
            margin-bottom: 15px;
        }
        .flash {
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 10px;
        }
        .flash.success { background-color: #d4edda; color: #155724; }
        .flash.danger { background-color: #f8d7da; color: #721c24; }
        .flash.info { background-color: #cce5ff; color: #004085; }

        a {
            display: block;
            text-align: center;
            margin-top: 15px;
            text-decoration: none;
            color: #764ba2;
            font-weight: 500;
        }
        a:hover {
            color: #5c3992;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>تغییر رمز عبور برای کاربر {{ username }}</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <div class="flashes">
              {% for category, message in messages %}
                <div class="flash {{ category }}">{{ message }}</div>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <form method="POST">
            <label for="recovery_code">کد بازیابی:</label>
            <input type="text" name="recovery_code" id="recovery_code" required>

            <label for="new_password">رمز عبور جدید:</label>
            <input type="password" name="new_password" id="new_password" required>

            <label for="confirm_password">تکرار رمز عبور جدید:</label>
            <input type="password" name="confirm_password" id="confirm_password" required>

            <button type="submit">تغییر رمز</button>
        </form>

        <a href="{{ url_for('login') }}">بازگشت به صفحه ورود</a>
    </div>

</body>
</html>
