<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>کتابخانه دیجیتال - مرکز ری‌شناسی</title>
<!-- Bootstrap RTL CSS Local -->
<link href="{{ url_for('static', filename='css/bootstrap.rtl.min.css') }}" rel="stylesheet">

<!-- Bootstrap Icons Local -->
<link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap-icons.css') }}">
<style>
@font-face {
    font-family: 'BTitr';
    src: url("{{ url_for('static', filename='css/fonts/BTitr.woff2') }}") format('woff2'),
         url("{{ url_for('static', filename='css/fonts/BTitr.woff') }}") format('woff');
    font-weight: normal;
    font-style: normal;
    font-display: swap;
}
@font-face {
    font-family: 'BZar';
    src: url("{{ url_for('static', filename='css/fonts/BZAR.woff2') }}") format('woff2'),
         url("{{ url_for('static', filename='css/fonts/BZAR.woff') }}") format('woff');
    font-weight: bold;
    font-style: normal;
    font-display: swap;
}

body {
    font-family: 'BZar', Tahoma, sans-serif;
    background: #f3f4f6;
}

.container {
    max-width: 400px;
    margin-top: 60px;
}

h2 {
    font-family: 'BTitr';
    font-weight: 700;
    text-align: center;
    margin-bottom: 20px;
}
</style>
</head>
<body>
<div class="container">
    <h2>ثبت‌نام</h2>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">{{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    <form method="POST" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
            <label for="username" class="form-label">نام کاربری</label>
            <input type="text" class="form-control" id="username" name="username" autocomplete="username" required>
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">ایمیل</label>
            <input type="email" class="form-control" id="email" name="email" autocomplete="email" required>
            <div class="form-text">برای تأیید حساب و بازیابی رمز عبور استفاده می‌شود.</div>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">رمز عبور</label>
            <input type="password" class="form-control" id="password" name="password"
                   autocomplete="new-password" minlength="8" required>
            <div class="form-text">حداقل ۸ کاراکتر</div>
        </div>
        <div class="mb-3">
            <label for="confirm_password" class="form-label">تکرار رمز عبور</label>
            <input type="password" class="form-control" id="confirm_password" name="confirm_password"
                   autocomplete="new-password" minlength="8" required>
        </div>
        <div class="mb-3">
            <label for="recovery" class="form-label">کد بازیابی</label>
            <input type="text" class="form-control" id="recovery" name="recovery" required>
        </div>
        <button type="submit" class="btn btn-success w-100">ثبت‌نام</button>
    </form>
    <script>
        // اعتبارسنجی سمت کلاینت: تطابق رمز عبور و تکرار آن
        document.querySelector('form').addEventListener('submit', function (e) {
            const password = document.getElementById('password');
            const confirm = document.getElementById('confirm_password');
            if (password.value !== confirm.value) {
                e.preventDefault();
                confirm.setCustomValidity('رمز عبور و تکرار آن یکسان نیستند');
                confirm.reportValidity();
            } else {
                confirm.setCustomValidity('');
            }
        });
    </script>
    <p class="mt-3 text-center">
        <a href="{{ url_for('login') }}">ورود به حساب</a>
    </p>
</div>
<script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
