{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-12">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2>{{ book.title }}</h2>
                <div>
                    <a href="{{ url_for('books') }}" class="btn btn-secondary">بازگشت به فهرست</a>
                    <a href="{{ url_for('download_book', book_id=book.id) }}" class="btn btn-primary">دانلود کتاب</a>
                </div>
            </div>
            
            <div class="card">
                <div class="card-body p-0">
                    <div class="ratio ratio-16x9">
                        <div style="position: relative; width: 100%; height: 100%;">
                            <iframe 
                                id="pdf-viewer"
                                src="{{ url_for('serve_pdf', filename=book.pdf_filename) }}#page={{ progress.position if progress and progress.position > 0 else 1 }}&toolbar=0&navpanes=0&scrollbar=0" 
                                style="border: none; width: 100%; height: 100%;"
                                allowfullscreen>
                            </iframe>
                            <div style="position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 1000;">
                                <button id="prev-page" class="btn btn-primary">صفحه قبل</button>
                                <button id="next-page" class="btn btn-primary">صفحه بعد</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .card {
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
    }
    iframe {
        width: 100%;
        height: 80vh;
        border: none;
    }
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const iframe = document.getElementById('pdf-viewer');
    let saveInProgress = false;
    
    // تابع برای ذخیره موقعیت صفحه فعلی
    function saveCurrentPage() {
        if (saveInProgress) return;
        
        try {
            const currentSrc = iframe.contentWindow.location.href;
            const pageMatch = currentSrc.match(/page=(\d+)/);
            if (pageMatch && pageMatch[1]) {
                const pageNum = pageMatch[1];
                saveInProgress = true;
                
                fetch('/save_reading_progress', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `book_id={{ book.id }}&position=${pageNum}`
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    if (!data.success) {
                        console.error('Error saving progress:', data.error || 'Unknown error');
                    }
                })
                .catch(error => {
                    console.error('Error saving progress:', error);
                })
                .finally(() => {
                    saveInProgress = false;
                });
            }
        } catch (e) {
            console.error('Error in saveCurrentPage:', e);
            saveInProgress = false;
        }
    }

    // ذخیره موقعیت هر 5 ثانیه
    setInterval(saveCurrentPage, 5000);

    // ذخیره موقعیت هنگام بسته شدن صفحه
    window.addEventListener('beforeunload', function() {
        const pageMatch = iframe.contentWindow.location.href.match(/page=(\d+)/);
        const pageNum = pageMatch ? pageMatch[1] : 1;
        
        // Use sendBeacon as a fallback
        const data = new URLSearchParams();
        data.append('book_id', '{{ book.id }}');
        data.append('position', pageNum);
        
        navigator.sendBeacon('/save_reading_progress', data);
    });
});
</script>
{% endblock %}
