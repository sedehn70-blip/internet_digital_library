{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow border-warning">
                <div class="card-header bg-warning-subtle text-center">
                    <i class="bi bi-cone-striped fs-3"></i>
                    <h5 class="mb-0 mt-1">درگاه پرداخت آزمایشی</h5>
                    <small class="text-muted">این یک درگاه واقعی نیست — فقط برای تست</small>
                </div>
                <div class="card-body text-center">
                    <p class="mb-1 text-muted">مبلغ قابل پرداخت</p>
                    <h2 class="text-primary mb-3">{{ purchase.amount|comma_separated }} تومان</h2>
                    <p class="text-muted mb-4">
                        بابت: کتاب «{{ purchase.book.title }}»
                    </p>

                    <form method="POST" action="{{ url_for('sandbox_payment_page', purchase_id=purchase.id) }}">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <button type="submit" name="outcome" value="success" class="btn btn-success btn-lg w-100 mb-2">
                            <i class="bi bi-check-circle me-1"></i> شبیه‌سازی پرداخت موفق
                        </button>
                        <button type="submit" name="outcome" value="cancel" class="btn btn-outline-danger w-100">
                            <i class="bi bi-x-circle me-1"></i> شبیه‌سازی انصراف / پرداخت ناموفق
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
